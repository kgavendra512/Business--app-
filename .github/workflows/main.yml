name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: business-app-apk
          path: bin/*.apk
